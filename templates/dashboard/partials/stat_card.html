<div class="gov-card h-100 border-start border-4 border-{{ color|default:'primary' }}">
    <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h6 class="text-muted text-uppercase small fw-bold mb-1" style="letter-spacing: 0.5px;">
                    {{ title }}
                </h6>
                <h2 class="mb-0 fw-bold text-dark" style="font-family: 'Merriweather', serif;">
                    {{ value }}
                </h2>
            </div>
            <div class="text-{{ color|default:'primary' }} opacity-50">
                <i class="bi bi-{{ icon }} fs-1"></i>
            </div>
        </div>
        
        {% if subtitle %}
        <div class="mt-3 pt-2 border-top">
            <small class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 0.5px;">
                {{ subtitle }}
            </small>
        </div>
        {% endif %}
    </div>
</div>
