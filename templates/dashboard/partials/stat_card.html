<div class="card shadow-sm border-0 h-100">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h6 class="text-muted text-uppercase mb-1">{{ title }}</h6>
                <h2 class="mb-0 fw-bold">{{ value }}</h2>
            </div>
            <div class="bg-{{ color|default:'primary' }} bg-opacity-10 p-3 rounded-circle">
                <i class="bi bi-{{ icon }} fs-3 text-{{ color|default:'primary' }}"></i>
            </div>
        </div>
        {% if subtitle %}
            <small class="text-muted mt-2 d-block">{{ subtitle }}</small>
        {% endif %}
    </div>
</div>
