{% load static %}
<div class="d-flex align-items-center me-3">
    <!-- Institutional Logo -->
    <img src="{% static 'images/logo.png' %}" alt="ComplianceSys Logo" class="me-2" style="height: 40px; width: auto; object-fit: contain; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));">
    
    <!-- Institutional Brand Text (Optional: Remove this div if your logo already contains the text) -->
    <div class="d-none d-sm-flex flex-column lh-1">
        <span class="fw-bold text-white" style="font-family: 'Merriweather', serif; font-size: 1.1rem; letter-spacing: 0.5px;">COMPLIANCE<span class="text-warning">SYS</span></span>
        <small class="text-uppercase text-light opacity-75" style="font-size: 0.6rem; letter-spacing: 1.5px;">Official Case Management</small>
    </div>
</div>
